<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Einen Hinweis, bitte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Ruhig und dicht: neutrale Flächen, feine Linien, ein Akzent (Gold) nur für Münzen und Markierungen. */
:root{
  --bg:#fafafa; --panel:#ffffff; --ink:#171717; --muted:#707070; --line:#e8e8e8; --hover:#f4f4f4; --soft:#f6f6f6;
  --gold:#f5b301; --gold-ink:#2b2000; --mark:#f5b301; --teal:#0e8a6d; --pink:#e5484d; --pink-ink:#fff;
  --btn:#171717; --btn-ink:#fafafa; --shadow:0 1px 2px rgba(0,0,0,.05);
  --body:'Geist','Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --panel:#111111; --ink:#ededed; --muted:#8f8f8f; --line:#262626; --hover:#1a1a1a; --soft:#161616;
  --gold:#f5b301; --teal:#3dd6a8; --pink:#ff6369; --btn:#ededed; --btn-ink:#0a0a0a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --panel:#111111; --ink:#ededed; --muted:#8f8f8f; --line:#262626; --hover:#1a1a1a; --soft:#161616;
  --gold:#f5b301; --teal:#3dd6a8; --pink:#ff6369; --btn:#ededed; --btn-ink:#0a0a0a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--body);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(17px,3.2vw,20px)} h2{font-size:13px;color:var(--muted);font-weight:500} h3{font-size:14px}
.panel>h2{margin-bottom:8px}
.top,.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;box-shadow:var(--shadow)}
.banner{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{font-weight:600;font-size:14px} .banner span{color:var(--muted);font-size:13px}
.stand{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.pl.me{border-color:var(--gold)}
.nm{font-weight:600;overflow-wrap:anywhere}
.coin{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-family:var(--mono);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.coin.neg{background:var(--pink);color:var(--pink-ink)}
.bal{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bal.big .coin{min-width:40px;height:40px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.mine{border-color:var(--teal)}
.tile .row{display:flex;gap:8px;align-items:center}
.tile .type{font-weight:600;overflow-wrap:anywhere}
.txt{background:var(--soft);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px;height:32px;cursor:pointer;
  transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease),box-shadow .15s var(--ease)}
@media (hover:hover){button:hover{background:var(--hover)}}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.pri,button.gold,button.ok{background:var(--btn);color:var(--btn-ink);border-color:transparent}
@media (hover:hover){button.pri:hover,button.gold:hover,button.ok:hover{background:var(--btn);opacity:.88}}
button.chip{height:28px;padding:0 10px;font-size:13px}
button.req{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
button[disabled]{opacity:.4;cursor:not-allowed}
input,select{font:inherit;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
.form{display:flex;gap:8px;flex-wrap:wrap}.form input{flex:1 1 180px}
.muted{color:var(--muted)}
.sol{border-left:3px solid var(--gold)}
.sol h2{color:var(--ink);font-size:16px;font-weight:600}
details summary{cursor:pointer;font-weight:500}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .r{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.rank .r:first-child{border-color:var(--gold)}
.pos{font-family:var(--mono);width:22px;color:var(--muted)}
.err{background:var(--pink);color:var(--pink-ink);border-radius:8px;padding:8px 10px;font-weight:500}
.pgrid{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (orientation:landscape) and (min-width:560px),(min-width:900px){.pgrid{grid-template-columns:1.1fr .9fr}}
.hl{display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:8px;padding:4px 10px 4px 6px;min-height:36px;font-weight:500;background:var(--panel)}
.hrow .type{flex:1;min-width:0;overflow-wrap:anywhere}
.hrow .st{font-size:12px;color:var(--muted);text-align:right}
.hrow.mine{border-color:var(--teal);background:var(--soft)} .hrow.mine .st{color:var(--teal);font-weight:600}
.hrow.taken{opacity:.45}
.hrow.marked{box-shadow:0 0 0 2px var(--mark)}
.hrow.card{align-items:flex-start;padding:8px 10px 8px 6px;height:auto}
.hrow.card .coin{margin-top:1px}
.hrow.card .ct{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.hrow.card .type{font-size:12px;color:var(--muted);font-weight:500}
.txt2{font-weight:500;overflow-wrap:anywhere}
.score{display:flex;flex-direction:column;gap:4px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:8px;min-height:32px}
.sr.me{border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head><body>
<div class="wrap" id="app"><p class="muted">Lädt …</p></div>
<script>
(function(){
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='host',hostId='',hostParam='',peer=null,pc=null,conns={},online={},myId='',myName='',linkState='init',copied=false,retry=null,msg='';
let state={phase:'lobby',round:-1,order:[],types:[],assign:{},freeGiven:{},result:{},solved:{}};
let players={},hostRounds=null,requests={},myHands=null,preview='',nameDraft='',confirmReset=false;
let roster={},busy=false,showSol=false,adjUser='',adjDraft='';

const PHASES={lobby:['Warteraum',''],buy1:['Kaufrunde 1','Jeder kauft mindestens einen Hinweis.'],buy2:['Kaufrunde 2','Weitere Hinweise sind freiwillig.'],guess:['Antworten','Jetzt wird geraten.'],reveal:['Auflösung','Die Runde ist vorbei.'],done:['Ende','Das Spiel ist beendet.']};

function coins(u){let c=15;const a=state.assign||{},rs=state.result||{};
  for(const r in a)for(const n in a[r])if(a[r][n]===u)c-=+n;
  for(const r in rs)if(rs[r][u]===true)c+=20;
  (state.adj||[]).forEach(x=>{if(x.u===u)c+=x.d});return c}
function pname(u){return (players[u]&&players[u].name)||'Spieler'}
function order(){return (state.order&&state.order.length)?state.order:Object.keys(players)}
function starter(){const o=order();if(!o.length)return null;
  if(state.round===4){let b=o[0];o.forEach(u=>{if(coins(u)<coins(b))b=u});return b}
  return o[Math.max(state.round,0)%o.length]}
function itemsFor(u){const out=[],R=hostRounds||[],a=state.assign||{};
  for(let r=0;r<=state.round;r++){const rd=R[r];if(!rd)continue;
    if(state.freeGiven&&state.freeGiven[r])out.push({r:r,free:1,type:'Gratis-Hinweis',text:rd.gratis.text});
    for(const n in (a[r]||{}))if(a[r][n]===u){const h=rd.hints[n-1];if(h)out.push({r:r,n:+n,type:h.type,text:h.text})}}
  return out}
function boughtCount(u){const a=(state.assign||{})[state.round]||{};let c=0;for(const n in a)if(a[n]===u)c++;return c}
function coinEl(v){return '<span class="coin'+(v<0?' neg':'')+'">'+v+'</span>'}

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const DEF=()=>({phase:'lobby',round:-1,order:[],types:[],assign:{},freeGiven:{},result:{},solved:{},adj:[],log:[]});
function link(){return location.origin+location.pathname+'?h='+hostId}
function broadcast(){
  for(const u in conns){const c=conns[u];if(!c||!c.open)continue;
    try{c.send({t:'snap',state:state,players:players,items:itemsFor(u)})}catch(e){}}}
function onHostMsg(c,m){
  if(m&&m.t==='join'&&typeof m.id==='string'&&typeof m.name==='string'){
    c._uid=m.id;conns[m.id]=c;online[m.id]=true;
    const name=m.name.trim().slice(0,24);
    if(name&&(!players[m.id]||players[m.id].name!==name)){players[m.id]={name:name};lsSet('hb-players',players)}
    broadcast();render()}}
function startHostPeer(){
  if(typeof Peer==='undefined'){linkState='nolib';render();return}
  try{if(peer)peer.destroy()}catch(e){}
  peer=new Peer(hostId);
  peer.on('open',()=>{linkState='ok';render()});
  peer.on('error',e=>{linkState=(e&&e.type==='unavailable-id')?'busy':'err';render();clearTimeout(retry);retry=setTimeout(startHostPeer,4000)});
  peer.on('disconnected',()=>{linkState='lost';render();try{peer.reconnect()}catch(e){}});
  peer.on('connection',c=>{
    const hi=()=>{try{c.send({t:'roster',players:players})}catch(e){}};
    if(c.open)hi();else c.on('open',hi);
    c.on('data',m=>onHostMsg(c,m));
    c.on('close',()=>{if(c._uid&&conns[c._uid]===c){delete conns[c._uid];online[c._uid]=false;render()}})})}
function initHost(){
  hostId=lsGet('hb-hid',null);if(!hostId){hostId='hb'+Math.random().toString(36).slice(2,8);lsSet('hb-hid',hostId)}
  state=Object.assign(DEF(),lsGet('hb-state',{}));players=lsGet('hb-players',{});hostRounds=lsGet('hb-rounds',null);
  startHostPeer()}
function sendJoin(){try{if(pc&&pc.open&&myName)pc.send({t:'join',id:myId,name:myName})}catch(e){}}
function connectPlayer(){
  if(typeof Peer==='undefined'){linkState='nolib';render();return}
  clearTimeout(retry);
  try{if(peer)peer.destroy()}catch(e){}
  linkState='connecting';render();
  peer=new Peer();
  const again=()=>{linkState='lost';render();clearTimeout(retry);retry=setTimeout(connectPlayer,3000)};
  peer.on('error',again);
  peer.on('open',()=>{
    pc=peer.connect(hostParam,{reliable:true});
    pc.on('open',()=>{linkState='ok';sendJoin();render()});
    pc.on('data',m=>{if(m&&m.t==='roster'){roster=m.players||{};render()}if(m&&m.t==='snap'){state=Object.assign(DEF(),m.state);players=m.players||{};myHands={items:m.items||[]};render()}});
    pc.on('close',again);pc.on('error',again);
    clearTimeout(retry);retry=setTimeout(()=>{if(linkState!=='ok')again()},9000)})}
function initPlayer(){
  myId=lsGet('hb-me',null);if(!myId){myId='p'+Math.random().toString(36).slice(2,10);lsSet('hb-me',myId)}
  myName=lsGet('hb-name','');connectPlayer()}
async function commit(ns){
  state=ns;lsSet('hb-state',ns);render();broadcast()}
function clone(){return JSON.parse(JSON.stringify(state))}

async function hostAct(act,d){
  if(busy)return;busy=true;
  try{
  const ns=clone();ns.assign=ns.assign||{};ns.result=ns.result||{};ns.freeGiven=ns.freeGiven||{};ns.solved=ns.solved||{};ns.adj=ns.adj||[];ns.log=ns.log||[];
  const r=state.round;
  const lg=(u,d,txt,extra)=>{ns.log.push(Object.assign({t:Date.now(),u:u,d:d,txt:txt,r:r},extra||{}));if(ns.log.length>150)ns.log.shift()};
  if(act==='start'){ns.order=Object.keys(players);if(!ns.order.length){busy=false;return}
    ns.assign={};ns.result={};ns.freeGiven={};ns.solved={};ns.adj=[];ns.log=[];showSol=false;ns.round=0;ns.phase='buy1';ns.types=hostRounds[0].hints.map(h=>h.type)}
  else if(act==='neworder'){ns.order=Object.keys(players)}
  else if(act==='assign'){ns.assign[r]=ns.assign[r]||{};const prev=ns.assign[r][d.n];if(prev&&prev!==d.u)lg(prev,d.n,'Hinweis '+d.n+' entzogen');ns.assign[r][d.n]=d.u;lg(d.u,-d.n,'Hinweis '+d.n+' gekauft');
    }
  else if(act==='unassign'){if(ns.assign[r]&&ns.assign[r][d.n]){lg(ns.assign[r][d.n],+d.n,'Hinweis '+d.n+' zurückgenommen');delete ns.assign[r][d.n]}}
  else if(act==='free'){ns.freeGiven[r]=true;ns.phase='buy2'}
  else if(act==='toguess'){ns.phase='guess'}
  else if(act==='mark'){ns.result[r]=ns.result[r]||{};const was=ns.result[r][d.u];if(was===d.v)delete ns.result[r][d.u];else ns.result[r][d.u]=d.v;const now=ns.result[r][d.u];if(was===true&&now!==true)lg(d.u,-20,'Richtig zurückgenommen');if(now===true)lg(d.u,20,'Richtig');if(now===false)lg(d.u,0,'Falsch')}
  else if(act==='adjust'){if(!d.u||!d.dv||isNaN(d.dv)){busy=false;return}const id=String(Date.now());ns.adj.push({id:id,u:d.u,d:d.dv});lg(d.u,d.dv,'Manuelle Korrektur',{k:'adj',id:id});adjDraft=''}
  else if(act==='undoadj'){const x=ns.adj.find(y=>y.id===d.id);if(x){ns.adj=ns.adj.filter(y=>y.id!==d.id);ns.log.forEach(e=>{if(e.id===d.id)e.undone=true})}}
  else if(act==='reveal'){ns.solved[r]=hostRounds[r].loesung;ns.phase='reveal'}
  else if(act==='next'){showSol=false;if(r>=hostRounds.length-1){ns.phase='done'}else{ns.round=r+1;ns.phase='buy1';ns.types=hostRounds[r+1].hints.map(h=>h.type)}}
  else if(act==='reset'){confirmReset=false;
    ns.order=[];ns.round=-1;ns.phase='lobby';ns.types=[];ns.assign={};ns.result={};ns.freeGiven={};ns.solved={};ns.adj=[];ns.log=[]}
  await commit(ns);
  }finally{busy=false}}

function addTest(){['Anna','Bernd','Clara','David'].forEach(nm=>{players['test_'+nm.toLowerCase()]={name:nm+' (Test)'}});lsSet('hb-players',players);render();broadcast()}
function rmTest(){Object.keys(players).forEach(u=>{if(u.indexOf('test_')===0)delete players[u]});lsSet('hb-players',players);render();broadcast()}
function playerJoin(){
  const name=nameDraft.trim().slice(0,24);if(!name)return;
  myName=name;lsSet('hb-name',name);sendJoin();render()}
function loadRounds(file){
  const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.rounds||!j.rounds.length||!j.rounds[0].hints)throw 0;hostRounds=j.rounds;lsSet('hb-rounds',hostRounds);msg=''}catch(e){msg='Die Datei passt nicht. Bitte rounds.json wählen.'}render()};
  rd.readAsText(file)}
function copyLink(){
  try{navigator.clipboard.writeText(link()).then(()=>{copied=true;render();setTimeout(()=>{copied=false;render()},1500)},()=>{})}catch(e){}}
function linkPanel(compact){
  const ids=Object.keys(players).filter(u=>u.indexOf('test_')!==0),on=ids.filter(u=>online[u]).length;
  const st={ok:'Bereit',init:'Startet …',busy:'Dieser Link ist in einem anderen Fenster offen.',err:'Verbindung zum Vermittler fehlgeschlagen. Wird neu versucht.',lost:'Verbindung unterbrochen. Wird neu versucht.',nolib:'Netzwerk-Bibliothek konnte nicht geladen werden.'}[linkState]||'';
  const warn=location.protocol==='file:'?'<div class="err">Die Seite liegt nur auf deinem Gerät. Für Mitspieler muss sie online unter einem Link stehen.</div>':'';
  if(compact)return warn+'<div class="who note"><span>'+on+' von '+ids.length+' online · '+esc(st)+'</span><button class="chip" data-act="copylink">'+(copied?'Kopiert':'Spieler-Link kopieren')+'</button></div>';
  return warn+'<div class="panel"><h2>Spieler-Link</h2><div class="form"><input readonly id="lnk" value="'+esc(link())+'" aria-label="Spieler-Link"><button class="pri" data-act="copylink">'+(copied?'Kopiert':'Kopieren')+'</button></div><p class="note" style="margin:8px 0 0">'+esc(st)+' Diese Seite muss in deinem Browser offen bleiben, solange gespielt wird.</p></div>'}

/* ---------- Ansichten ---------- */
function standings(meUid){
  return '<div class="stand">'+order().map(u=>'<div class="pl'+(u===meUid?' me':'')+'"><span class="nm">'+esc(pname(u))+(u===meUid?' (du)':'')+'</span><span class="bal">'+coinEl(coins(u))+'<span class="note">Münzen</span></span></div>').join('')+'</div>'}
function banner(){
  const p=PHASES[state.phase]||['',''];const s=starter();
  const rn=state.round>=0&&state.phase!=='done'?'Runde '+(state.round+1)+(state.round===4?' · Bonus':'')+' · ':'';
  return '<div class="banner"><div><b>'+rn+esc(p[0])+'</b><br><span>'+esc(p[1])+'</span></div>'+
    (s&&state.round>=0&&state.phase!=='done'?'<span>Beginnt: <b>'+esc(pname(s))+'</b></span>':'')+'</div>'}
function finalView(meUid){
  const o=order().slice().sort((a,b)=>coins(b)-coins(a));
  return '<div class="panel"><h2>Endstand</h2><div class="rank" style="margin-top:12px">'+o.map((u,i)=>'<div class="r"><span class="pos">'+(i+1)+'</span><span style="flex:1;font-weight:700">'+esc(pname(u))+(u===meUid?' (du)':'')+'</span>'+coinEl(coins(u))+'</div>').join('')+'</div></div>'}

let marks={};try{marks=JSON.parse(localStorage.getItem('hb-marks')||'{}')}catch(e){}
function toggleMark(k){if(marks[k])delete marks[k];else marks[k]=1;try{localStorage.setItem('hb-marks',JSON.stringify(marks))}catch(e){}render()}
function scoreList(meUid){
  const o=order().slice().sort((x,y)=>coins(y)-coins(x));
  return '<div class="score">'+o.map(x=>'<div class="sr'+(x===meUid?' me':'')+'"><span class="nm">'+esc(pname(x))+(x===meUid?' (du)':'')+'</span>'+coinEl(coins(x))+'</div>').join('')+'</div>'}
function playerView(u,readonly){
  const mine=readonly?itemsFor(u):((myHands&&myHands.items)||[]);
  const r=state.round,a=(state.assign||{})[r]||{};
  const p=PHASES[state.phase]||['',''],s=starter();
  const rn=r>=0&&state.phase!=='done'?'Runde '+(r+1)+(r===4?' · Bonus':'')+' · ':'';
  let h='<div class="phead"><div><h1>'+esc(pname(u))+'</h1><div class="note">'+rn+esc(p[0])+(s&&r>=0&&state.phase!=='done'?' · Start: '+esc(pname(s)):'')+'</div></div><div class="bal big">'+coinEl(coins(u))+'</div></div>';
  if(msg)h+='<div class="err">'+esc(msg)+'</div>';
  if(state.phase==='done')return h+finalView(u);
  if(state.phase==='lobby'||r<0)return h+'<div class="panel"><p class="muted" style="margin:0">Warte auf den Start.</p></div>'+(order().length?'<div class="panel">'+scoreList(u)+'</div>':'');
  h+='<div class="pgrid"><section class="panel"><div class="hl">';
  (state.types||[]).forEach((t,i)=>{const n=i+1,by=a[n],isMine=by===u,taken=by&&!isMine,k=r+'-'+n;
    h+='<button class="hrow'+(isMine?' mine':'')+(taken?' taken':'')+(marks[k]?' marked':'')+'" data-act="pmark" data-k="'+k+'">'+coinEl(n)+'<span class="type">'+esc(t)+'</span><span class="st">'+(isMine?'du':taken?esc(pname(by)):'')+'</span></button>'});
  h+='</div></section><section class="side">';
  h+='<div class="panel">'+scoreList(u)+'</div>';
  const cur=mine.filter(x=>x.r===r).sort((x,y)=>(x.free?0:x.n)-(y.free?0:y.n));
  h+='<div class="panel"><h2>Deine Hinweise</h2>'+(cur.length?'<div class="hl">'+cur.map(x=>{const k=r+'-'+(x.free?'f':x.n);return '<button class="hrow card'+(marks[k]?' marked':'')+'" data-act="pmark" data-k="'+k+'">'+(x.free?'<span class="coin">0</span>':coinEl(x.n))+'<span class="ct"><span class="type">'+esc(x.free?'Gratis-Hinweis':x.type)+'</span><span class="txt2">'+esc(x.text)+'</span></span></button>'}).join('')+'</div>':'<p class="muted" style="margin:0">–</p>')+'</div>';
  const prev=mine.filter(x=>x.r<r);
  if(prev.length){const rs=[...new Set(prev.map(x=>x.r))].sort((x,y)=>y-x);
    h+='<div class="panel"><details><summary>Früher</summary>'+rs.map(rr=>'<h3 style="margin:12px 0 6px">Runde '+(rr+1)+(state.solved&&state.solved[rr]?' · '+esc(state.solved[rr]):'')+'</h3>'+prev.filter(x=>x.r===rr).map(x=>'<p style="margin:4px 0"><b>'+(x.free?'Gratis':x.n+' · '+esc(x.type))+':</b> '+esc(x.text)+'</p>').join('')).join('')+'</details></div>'}
  if(state.phase==='reveal'&&state.solved&&state.solved[r])h+='<div class="panel sol"><div class="tag">Lösung</div><h2>'+esc(state.solved[r])+'</h2></div>';
  h+='</section></div>';
  return h}

function hostView(){
  const R=hostRounds,r=state.round;
  let h='<div class="top"><div><div class="tag">Spielleiter</div><h1>Einen Hinweis, bitte</h1></div><div class="form"><select id="prev" aria-label="Spieleransicht"><option value="">Steuerpult</option>'+order().map(u=>'<option value="'+esc(u)+'"'+(preview===u?' selected':'')+'>Ansicht: '+esc(pname(u))+'</option>').join('')+'</select></div></div>';
  if(msg)h+='<div class="err">'+esc(msg)+'</div>';
  if(!R)return h+'<div class="panel"><h2>Hinweise laden</h2><p style="margin:0 0 10px">Wähle die Datei rounds.json aus. Sie bleibt auf diesem Gerät.</p><input type="file" id="rf" accept=".json,application/json"></div>';
  if(preview&&players[preview])return h+'<div class="panel" style="background:var(--soft)"><p class="note" style="margin:0">Vorschau: So sieht '+esc(pname(preview))+' die Seite. Zugeteilt wird nur im Steuerpult.</p></div>'+playerView(preview,true);
  if(state.phase==='lobby'||r<0){
    const ids=Object.keys(players);
    h+=linkPanel(false);
    h+='<div class="panel"><h2 style="margin-bottom:6px">Warteraum</h2><p class="muted" style="margin:0 0 12px">Die Spieler öffnen den Link und tragen ihren Namen ein.</p>'+
      (ids.length?'<div class="stand">'+ids.map(u=>'<div class="pl"><span class="nm">'+esc(pname(u))+(u.indexOf('test_')===0?'':(online[u]?' <span style="color:var(--teal)">●</span>':' <span class="muted">○</span>'))+'</span></div>').join('')+'</div>':'<p class="muted">Noch niemand eingetragen.</p>')+
      '<div class="who" style="margin-top:14px"><button class="pri" data-act="start"'+(ids.length?'':' disabled')+'>Spiel starten mit '+ids.length+' Spielern</button><button class="chip" data-act="addtest">Testspieler hinzufügen</button>'+(ids.some(u=>u.indexOf('test_')===0)?'<button class="chip" data-act="rmtest">Testspieler entfernen</button>':'')+'</div><p class="note">Testmodus: Mit "Ansicht: Anna (Test)" siehst du die Seite wie ein Spieler.</p></div>';
    return h}
  h+=linkPanel(true);
  h+=banner();
  if(state.phase==='done'){h+=finalView(null);h+=adjustBlock();h+=resetBlock();return h}
  const rd=R[r],a=(state.assign||{})[r]||{},res=(state.result||{})[r]||{},o=order();
  const missing=Object.keys(players).filter(u=>!o.includes(u));
  if(missing.length)h+='<div class="panel"><p style="margin:0 0 10px">Neu eingetragen: '+missing.map(u=>esc(pname(u))).join(', ')+'</p><button data-act="neworder">Zur Runde hinzufügen</button></div>';
  h+='<div class="panel sol"><div class="who" style="justify-content:space-between"><span class="tag">Lösung dieser Runde</span><button class="chip" data-act="togglesol">'+(showSol?'Verbergen':'Anzeigen')+'</button></div>'+(showSol?'<h2 style="margin-top:6px">'+esc(rd.loesung)+'</h2>':'')+'</div>';
  h+='<div class="panel"><h2 style="margin-bottom:10px">Punktestand und Käufe</h2><div class="stand">'+o.map(u=>'<div class="pl"><span class="nm">'+esc(pname(u))+'</span><span class="bal">'+coinEl(coins(u))+'<span class="note">'+boughtCount(u)+' gekauft'+(state.phase==='buy1'&&boughtCount(u)===0?' · fehlt':'')+'</span></span></div>').join('')+'</div></div>';
  h+='<div class="panel"><h2 style="margin-bottom:10px">Hinweise zuteilen</h2><div class="grid">';
  rd.hints.forEach(hh=>{const n=hh.n,by=a[n];
    const asking=o.filter(u=>requests[u]&&requests[u].r===r&&requests[u].n===n);
    h+='<div class="tile'+(by?' mine':'')+'"><div class="row">'+coinEl(n)+'<span class="type">'+esc(hh.type)+'</span></div><div class="txt">'+esc(hh.text)+'</div><span class="note">'+esc(hh.note)+'</span>';
    if(by)h+='<div class="who"><span>→ <b>'+esc(pname(by))+'</b></span><button class="chip" data-act="unassign" data-n="'+n+'">Zurücknehmen</button></div>';
    else h+='<div class="who">'+o.map(u=>'<button class="chip'+(asking.includes(u)?' req':'')+'" data-act="assign" data-n="'+n+'" data-u="'+esc(u)+'">'+esc(pname(u))+(asking.includes(u)?' fragt an':'')+'</button>').join('')+'</div>';
    h+='</div>'});
  h+='</div></div>';
  h+='<div class="panel"><h2 style="margin-bottom:6px">Gratis-Hinweis für alle</h2><div class="txt tile" style="background:var(--soft)">'+esc(rd.gratis.text)+'</div><p class="note">'+esc(rd.gratis.note)+(state.freeGiven&&state.freeGiven[r]?' · bereits verteilt':'')+'</p></div>';
  if(state.phase==='guess'||state.phase==='reveal'){
    h+='<div class="panel"><h2 style="margin-bottom:10px">Antworten</h2><div class="rank">'+o.map(u=>'<div class="r"><span style="flex:1;font-weight:700">'+esc(pname(u))+'</span>'+(res[u]===true?'<span class="note">+20</span>':'')+'<button class="chip ok" style="'+(res[u]===true?'':'background:var(--panel);color:var(--ink);border-color:var(--line)')+'" data-act="mark" data-u="'+esc(u)+'" data-v="1">Richtig</button><button class="chip" style="'+(res[u]===false?'background:var(--pink);color:var(--pink-ink);border-color:transparent':'')+'" data-act="mark" data-u="'+esc(u)+'" data-v="0">Falsch</button></div>').join('')+'</div></div>'}
  h+='<div class="panel"><div class="who">';
  if(state.phase==='buy1')h+='<button class="gold" data-act="free">Gratis-Hinweis verteilen, weiter zu Kaufrunde 2</button>';
  if(state.phase==='buy2')h+='<button class="gold" data-act="toguess">Weiter zu den Antworten</button>';
  if(state.phase==='guess')h+='<button class="gold" data-act="reveal">Auflösung zeigen</button>';
  if(state.phase==='reveal')h+='<button class="pri" data-act="next">'+(r>=R.length-1?'Spiel beenden':'Nächste Runde')+'</button>';
  h+='</div></div>'+adjustBlock()+resetBlock();
  return h}
function adjustBlock(){
  const o=order(),log=(state.log||[]).slice().reverse();
  const fmt=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  return '<div class="panel"><h2>Punkte korrigieren</h2><div class="form"><select id="adjP" aria-label="Spieler">'+o.map(u=>'<option value="'+esc(u)+'"'+((adjUser||o[0])===u?' selected':'')+'>'+esc(pname(u))+'</option>').join('')+'</select><input id="adjN" type="number" inputmode="numeric" step="1" placeholder="z. B. -3 oder 5" value="'+esc(adjDraft)+'" style="flex:0 1 150px"><button class="pri" data-act="adjust">Buchen</button></div>'+
   '<details style="margin-top:10px"><summary>Verlauf ('+log.length+')</summary><div class="score" style="margin-top:8px">'+(log.length?log.map(e=>'<div class="sr"><span style="min-width:0;overflow-wrap:anywhere'+(e.undone?';text-decoration:line-through;opacity:.5':'')+'"><span class="note">'+fmt(e.t)+' · R'+((e.r||0)+1)+'</span> <b>'+esc(pname(e.u))+'</b> '+esc(e.txt)+'</span><span class="who">'+(e.d?'<span class="coin'+(e.d<0?' neg':'')+'">'+(e.d>0?'+':'')+e.d+'</span>':'')+(e.k==='adj'&&!e.undone?'<button class="chip" data-act="undoadj" data-id="'+esc(e.id)+'">Rückgängig</button>':'')+'</span></div>').join(''):'<p class="muted" style="margin:0">Noch nichts gebucht.</p>')+'</div></details></div>'}
function resetBlock(){
  return '<div class="panel"><div class="who">'+(confirmReset?'<span>Alles zurücksetzen?</span><button class="pri chip" data-act="reset">Ja, zurücksetzen</button><button class="chip" data-act="cancelreset">Abbrechen</button>':'<button class="chip" data-act="askreset">Spiel zurücksetzen</button><button class="chip" data-act="reloadrounds">Hinweisdatei tauschen</button>')+'</div></div>'}

function joinView(){
  return '<div class="top"><div><div class="tag">Einen Hinweis, bitte</div><h1>Willkommen</h1></div></div>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<div class="panel"><h2 style="margin-bottom:10px">Wie heißt du?</h2><div class="form"><input id="nm" maxlength="24" autocomplete="off" placeholder="Dein Name" value="'+esc(nameDraft)+'"><button class="pri" data-act="join">Mitspielen</button></div></div>'+
    (Object.keys(roster).filter(u=>u.indexOf('test_')!==0).length?'<div class="panel"><h2 style="margin-bottom:10px">Schon dabei gewesen?</h2><div class="who">'+Object.keys(roster).filter(u=>u.indexOf('test_')!==0).map(u=>'<button class="chip" data-act="claim" data-u="'+esc(u)+'">'+esc(roster[u].name)+'</button>').join('')+'</div></div>':'')}

function render(){
  const app=document.getElementById('app');if(!app)return;
  const ae=document.activeElement,aid=ae&&ae.id,ss=ae&&ae.selectionStart;
  let h;
  if(mode==='host')h=hostView();
  else if(!myName)h=joinView();
  else if(!players[myId])h='<div class="panel"><p class="muted" style="margin:0">'+(linkState==='ok'?'Eintragen …':'Verbinde mit dem Spiel …')+'</p></div>';
  else h=(linkState!=='ok'?'<div class="note">Verbindung wird neu hergestellt …</div>':'')+playerView(myId,false);
  app.innerHTML=h;
  if(aid==='nm'||aid==='adjN'){const el=document.getElementById(aid);if(el){el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,n=b.dataset.n?+b.dataset.n:null,u=b.dataset.u;
  if(act==='claim'&&roster[u]){myId=u;myName=roster[u].name;lsSet('hb-me',myId);lsSet('hb-name',myName);sendJoin();render()}
  else if(act==='join')playerJoin();
  else if(act==='copylink')copyLink();
  else if(act==='reloadrounds'){hostRounds=null;lsSet('hb-rounds',null);render()}
  else if(act==='pmark')toggleMark(b.dataset.k);
  else if(act==='togglesol'){showSol=!showSol;render()}
  else if(act==='adjust'){const p=document.getElementById('adjP'),v=document.getElementById('adjN');hostAct('adjust',{u:p&&p.value,dv:parseInt(v&&v.value,10)})}
  else if(act==='undoadj')hostAct('undoadj',{id:b.dataset.id})
  else if(act==='addtest')addTest();
  else if(act==='rmtest'){preview='';rmTest()}
  else if(act==='askreset'){confirmReset=true;render()}
  else if(act==='cancelreset'){confirmReset=false;render()}
  else if(act==='mark')hostAct('mark',{u:u,v:b.dataset.v==='1'});
  else hostAct(act,{n:n,u:u})});
document.addEventListener('input',e=>{if(e.target.id==='nm')nameDraft=e.target.value;if(e.target.id==='adjN')adjDraft=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='rf'&&e.target.files[0])loadRounds(e.target.files[0]);if(e.target.id==='prev'){preview=e.target.value;render()}if(e.target.id==='adjP')adjUser=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm')playerJoin()});

function boot(){
  const q=new URLSearchParams(location.search).get('h');
  if(q){mode='player';hostParam=q;initPlayer()}else{mode='host';initHost()}
  render()}
boot();
})();
</script>
</body></html>
