    if(ns.phase!=='joker2'&&ns.phase!=='solve')return fail('Joker werden nach Kaufrunde 2 aktiviert.');
    const pl=(ns.plays[r]=ns.plays[r]||[]),shielded=x=>pl.some(p=>p.id==='schild'&&p.u===x);
    const k='j'+Date.now(),play={k:k,id:id,u:u},mx=Math.max.apply(null,order().map(x=>coinsIn(ns,x)));
    if(['raub','spion','steuer','wette'].includes(id)){if(!t||!players[t])return fail('Bitte ein Ziel wählen.');play.t=t;if(t===u&&id!=='steuer')return fail('Nicht auf sich selbst.')}
    if(['raub','spion','steuer'].includes(id)&&shielded(play.t))return fail(pname(play.t)+' ist durch ein Schutzschild geschützt.');
    if(id==='steuer'&&coinsIn(ns,play.t)<mx)return fail('Die Steuer trifft nur den Führenden.');
    if(id==='dn'&&coinsIn(ns,u)>=mx)return fail('Wer führt, darf diesen Joker nicht nutzen.');
    if(id==='vor'&&r>BONUS-2)return fail('Vorrang geht nur in Runde 1 bis 3.');
    if(id==='spion'){let best=null;const ar=ns.assign[r]||{};for(const n in ar)if(ar[n]===play.t){const pr=PS(ns,r,n);if(!best||pr<best.p||(pr===best.p&&+n<best.n))best={n:+n,p:pr}}
      if(!best)return fail(pname(play.t)+' hat keinen Hinweis.');play.n=best.n}
    if(id==='raub'){ns.adj.push({id:k+'a',u:u,d:4,grp:k},{id:k+'b',u:play.t,d:-4,grp:k});lg(u,4,'Raub von '+pname(play.t));lg(play.t,-4,'Raub durch '+pname(u))}
    if(id==='steuer'){ns.adj.push({id:k+'a',u:play.t,d:-5,grp:k});lg(play.t,-5,'Steuer')}
    hd.splice(ix,1);pl.push(play);ns.req[r]=(ns.req[r]||[]).filter(x=>!(x.u===u&&x.id===id));lg(u,0,'Joker: '+JK[id].n+(play.t?' → '+pname(play.t):''))}
  else if(act==='jreject'){ns.req[r]=(ns.req[r]||[]).filter(x=>x.k!==d.k)}
  else if(act==='junplay'){const pl=ns.plays[r]||[],p=pl.find(x=>x.k===d.k);if(!p){busy=false;return}
    const hd=(ns.hand[p.u]=ns.hand[p.u]||[]);
    if(hd.length>=2)return fail('Hand ist voll, Joker kann nicht zurück.');
    hd.push(p.id);ns.adj=ns.adj.filter(x=>x.grp!==p.k);ns.plays[r]=pl.filter(x=>x.k!==p.k);
    if(p.id==='raub'){lg(p.u,-4,'Raub zurückgenommen');lg(p.t,4,'Raub zurückgenommen')}
    if(p.id==='steuer')lg(p.t,5,'Steuer zurückgenommen');
    lg(p.u,0,'Joker zurückgenommen: '+JK[p.id].n)}
  await commit(ns);
  }finally{busy=false}}

      ctl='<button class="chip'+(v?' ok':'')+'" data-act="pend" data-u="'+esc(u)+'" data-v="1">Richtig</button><button class="chip" style="'+(pe[u]===false?'background:var(--pink);color:var(--pink-ink);border-color:transparent':'')+'" data-act="pend" data-u="'+esc(u)+'" data-v="0">Falsch</button>'+(sug?'<span class="note">passt</span>':'')}
    if(ph==='reveal'){ctl='<button class="chip'+(res[u]===true?' ok':'')+'" data-act="mark" data-u="'+esc(u)+'" data-v="1">Richtig</button><button class="chip" style="'+(res[u]===false?'background:var(--pink);color:var(--pink-ink);border-color:transparent':'')+'" data-act="mark" data-u="'+esc(u)+'" data-v="0">Falsch</button>'+(has('dn',u)&&res[u]===true?'<span class="note">+40</span>':'')}
    return '<div class="arow" style="border-left:4px solid '+PCOL[ci(u)]+'">'+dot(u)+'<b>'+esc(pname(u))+'</b><span class="at'+(txt?'':' empty')+'">'+(txt||'noch nichts')+'</span>'+(st?'<span class="pill">'+st+'</span>':'')+ctl+'</div>'}).join('')+'</div></div>'}
const GUIDE0=1;
const GUIDE={joker1:['Joker verkaufen','Jeder darf höchstens 2 Joker halten. Tippe bei einer Karte auf den Käufer.'],
 buy1:['Hinweise vergeben','Tippe bei jedem Hinweis den Namen des Käufers an. ★ heißt: Spieler hat ihn vorgemerkt.'],
 buy2:['Weitere Hinweise','Freiwillig. Gleiche Reihenfolge wie vorhin.'],
 joker2:['Joker, jetzt teurer','Letzte Kaufchance. Danach Joker aktivieren, Schutzschilde zuerst.'],
 solve:['Alle tippen','Genehmige Joker-Anfragen, warte auf alle Antworten, dann schließen.'],
 closed:['Auswerten','Lies die Antworten vor, markiere Richtig oder Falsch.'],
 reveal:['Lösung ist offen','Du kannst Richtig und Falsch noch ändern.']};
function nowCard(){const ph=state.phase,g=GUIDE[ph]||['',''],r=state.round,o=order();let extra='';
  if(ph==='buy1'){const mi=o.filter(u=>boughtCount(u)===0);extra=mi.length?'<p style="color:var(--ink)"><b>Noch ohne Hinweis:</b> '+mi.map(u=>dot(u)+' '+esc(pname(u))).join(' · ')+'</p>':'<p style="color:var(--teal)"><b>Alle haben einen Hinweis.</b></p>'}
  if(ph==='solve'){const A=((state.answers||{})[r])||{},n=o.filter(u=>A[u]&&A[u].l).length,q=(((state.req||{})[r])||[]).length;extra='<p style="color:var(--ink)"><b>'+n+' von '+o.length+' eingeloggt'+(q?' · '+q+' Joker-Anfrage'+(q>1?'n':''):'')+'</b></p>'}
  if(r===BONUS&&(ph==='buy1'||ph==='buy2'))extra+='<p>Bonusrunde: Die Preise sind gemischt.</p>';
  return '<div class="now"><span class="nt">Runde '+(r+1)+(r===BONUS?' · Bonus':'')+' · '+esc((PHASES[ph]||[''])[0])+'</span><b>'+esc(g[0])+'</b><p>'+esc(g[1])+'</p>'+extra+'</div>'}
function turnCard(){const t=tord(),act=state.turn;
  return '<div class="panel ph"><div class="who" style="justify-content:space-between"><span class="tag">Am Zug</span><button class="chip" data-act="nextturn">Zug beenden</button></div>'+
   (act?'<div class="who" style="margin:8px 0"><span class="dot" style="background:'+PCOL[ci(act)]+';width:34px;height:34px;font-size:15px;color:'+(ci(act)===3?'#2b2000':'#fff')+'">'+esc(pname(act).trim().charAt(0).toUpperCase())+'</span><b style="font-size:18px">'+esc(pname(act))+'</b></div>':'<p class="muted" style="margin:8px 0">Niemand am Zug. Wähle einen Spieler.</p>')+
   '<div class="who">'+t.map((u,i)=>'<button class="chip'+(act===u?' req':'')+'" style="border-color:'+PCOL[ci(u)]+'" data-act="setturn" data-u="'+esc(u)+'">'+(i+1)+' '+esc(pname(u))+'</button>').join('')+'</div></div>'}
function hintRows(){const r=state.round,rd=hostRounds[r],a=(state.assign||{})[r]||{},o=order(),buying=state.phase==='buy1'||state.phase==='buy2',act=buying?state.turn:null;
  const chip=(u,n,asking)=>{const on=u===act,mk=asking.includes(u),c=PCOL[ci(u)],dark=ci(u)===3?'#2b2000':'#fff';
    return '<button class="chip" style="border-color:'+c+';'+(on?'background:'+c+';color:'+dark+';font-weight:700':(mk?'box-shadow:0 0 0 2px '+c:''))+'" data-act="assign" data-n="'+n+'" data-u="'+esc(u)+'">'+esc(pname(u))+(mk&&!on?' ★':'')+'</button>'};
  const ord=act?[act].concat(o.filter(u=>u!==act)):o;
  return '<div class="panel ph"><h2 style="margin-bottom:8px">Hinweise vergeben'+(act?' · '+esc(pname(act))+' ist dran':'')+'</h2><div class="hl">'+rd.hints.map(hh=>{const n=hh.n,by=a[n],asking=markersFor(n);
    let h='<div class="hr'+(by?' taken':'')+'" style="'+(by?'border-left:4px solid '+PCOL[ci(by)]+';':'')+'"><div class="hm" style="cursor:default">'+coinEl(PS(state,r,n))+'<span class="ty">'+esc(hh.type)+'</span><span class="dots">'+(by?dot(by):asking.map(x=>dot(x)).join(''))+'</span></div>';
    if(by&&buying)h+='<div class="ft"><span class="note">an '+esc(pname(by))+'</span><button class="chip" data-act="unassign" data-n="'+n+'">Zurücknehmen</button></div>';
    else if(!by&&buying)h+='<div class="ft">'+ord.map(u=>chip(u,n,asking)).join('')+'</div>';
    h+='<details class="hd"><summary>Inhalt und Hintergrund</summary><div class="txt" style="margin:6px 0">'+esc(hh.text)+'</div><span class="note">'+esc(hh.note)+'</span>'+(hh.bg?'<p class="note" style="margin:4px 0 0"><b>Hintergrund:</b> '+esc(hh.bg)+'</p>':'')+'</details></div>';return h}).join('')+'</div></div>'}
function reqPanel(){if(state.phase!=='solve')return '';const L=(((state.req||{})[state.round])||[]);
  if(!L.length)return '<div class="panel pj"><h2>Joker-Anfragen</h2><p class="muted" style="margin:0">Noch keine Anfragen.</p></div>';
  const o=order(),mx=Math.max.apply(null,o.map(coins)),leaders=o.filter(x=>coins(x)===mx);
  return '<div class="panel pj"><div class="who" style="justify-content:space-between"><h2>Joker-Anfragen ('+L.length+')</h2>'+(L.length>1?'<button class="chip pri" data-act="japproveall">Alle genehmigen</button>':'')+'</div>'+L.map(q=>{const J=JK[q.id];
    return '<div class="tile" style="margin-top:8px"><div class="who">'+dot(q.u)+'<b>'+esc(pname(q.u))+'</b><span>'+esc(J.n)+'</span>'+(q.t?'→ '+dot(q.t)+esc(pname(q.t)):'')+'</div><span class="note">'+esc(J.d)+'</span><div class="who">'+(q.id==='steuer'&&leaders.length>1?'<select id="st_'+q.k+'" aria-label="Führender">'+leaders.map(x=>'<option value="'+esc(x)+'">'+esc(pname(x))+'</option>').join('')+'</select>':'')+'<button class="pri chip" data-act="japprove" data-k="'+q.k+'">Genehmigen</button><button class="chip" data-act="jreject" data-k="'+q.k+'">Ablehnen</button></div></div>'}).join('')+'</div>'}
function hostView(){
  const R=hostRounds,r=state.round;
  let h='<div class="top"><div><div class="tag">'+(DEMO?'Vorschau · Spielleiter':'Spielleiter')+'</div><h1>Einen Hinweis, bitte</h1></div></div>'+(preview&&players[preview]?'':viewTabs());
  if(msg)h+='<div class="err">'+esc(msg)+'</div>';
  if(!R)return h+'<div class="panel"><h2>Hinweise laden</h2><p style="margin:0 0 10px">Wähle die Datei rounds.json aus. Sie bleibt auf diesem Gerät.</p><input type="file" id="rf" accept=".json,application/json"></div>';
  if(preview&&players[preview])return viewTabs()+playerView(preview,true);
  if(state.phase==='lobby'||r<0){
    const ids=Object.keys(players);
    h+=DEMO?'':linkPanel(false);
    h+='<div class="panel"><h2 style="margin-bottom:6px">Warteraum</h2>'+
      (ids.length?'<div class="stand">'+ids.map(u=>'<div class="pl" style="border-left:4px solid '+PCOL[ci(u)]+'"><span class="nm who">'+dot(u)+esc(pname(u))+(u.indexOf('test_')===0?'':(online[u]?' <span style="color:var(--teal)">●</span>':' <span class="muted">○</span>'))+'</span></div>').join('')+'</div>':'<p class="muted">Noch niemand eingetragen.</p>')+
      '<div class="who" style="margin-top:14px"><button class="pri" data-act="start"'+(ids.length?'':' disabled')+'>Spiel starten mit '+ids.length+' Spielern</button><button class="chip" data-act="addtest">Testspieler hinzufügen</button>'+(ids.some(u=>u.indexOf('test_')===0)?'<button class="chip" data-act="rmtest">Testspieler entfernen</button>':'')+'</div></div>';
    return h}
  h+=DEMO?'':linkPanel(true);
  if(state.phase==='done'){h+=finalView(null);h+='<details class="panel more"><summary>Mehr</summary>'+adjustBlock()+resetBlock()+'</details>';return h}
  const rd=R[r],o=order(),ph=state.phase,buying=ph==='buy1'||ph==='buy2';
  h+=nowCard()+stepper();
  const missing=Object.keys(players).filter(u=>!o.includes(u));
  if(missing.length)h+='<div class="panel"><p style="margin:0 0 10px">Neu eingetragen: '+missing.map(u=>esc(pname(u))).join(', ')+'</p><button data-act="neworder">Zur Runde hinzufügen</button></div>';
  if(buying)h+=turnCard();
  if(ph==='joker1'||ph==='joker2')h+='<div class="panel pj"><h2 style="margin-bottom:8px">'+(ph==='joker1'?'Joker-Angebot':'Joker-Angebot · +2 Punkte')+'</h2>'+jokerShopCards(null,true)+'</div>';
  h+=reqPanel();
  if(ph==='joker2'||ph==='solve')h+='<details class="panel more"><summary>Joker manuell aktivieren</summary>'+jokerUseHost().replace('class="panel"','class="panel pj"')+'</details>';
  if(ph==='solve'||ph==='closed'||ph==='reveal')h+=answersHost();
  else if(ph==='buy1'||ph==='buy2'||ph==='joker2')h+='<details class="panel more"><summary>Eingaben der Spieler (live)</summary>'+answersHost().replace('class="panel"','class="panel"')+'</details>';
  if(buying)h+=hintRows();
  h+='<div class="stand">'+o.map(u=>'<div class="pl" style="border-left:4px solid '+PCOL[ci(u)]+(state.turn===u&&buying?';box-shadow:0 0 0 2px '+PCOL[ci(u)]:'')+'"><span class="nm who">'+dot(u)+esc(pname(u))+jbadge(u)+'</span><span class="bal">'+coinEl(coins(u))+'<span class="note">'+boughtCount(u)+' Hinw.</span></span></div>').join('')+'</div>';
  h+='<div class="panel sol"><div class="who" style="justify-content:space-between"><span class="tag">Lösung dieser Runde</span><button class="chip" data-act="togglesol">'+(showSol?'Verbergen':'Anzeigen')+'</button></div>'+(showSol?'<h2 style="margin-top:6px">'+esc(rd.loesung)+'</h2><p class="note" style="margin:4px 0 0">'+esc(rd.gratis.bg||'')+'</p>':'')+'</div>';
  h+='<div class="panel"><h2 style="margin-bottom:6px">Gratis für alle</h2><div class="txt tile" style="background:var(--soft)">'+esc(rd.gratis.text)+'</div><p class="note">'+esc(rd.gratis.note)+(state.freeGiven&&state.freeGiven[r]?' · bereits verteilt':' · wird beim Weiter verteilt')+'</p></div>';
  h+='<details class="panel more"><summary>Mehr: Punkte korrigieren, Verlauf, Zurücksetzen</summary>'+adjustBlock()+resetBlock()+'</details>';
  const nb=nextBtn();h+='<div class="dock">'+nb+'</div>';
  return h}
function adjustBlock(){
  const o=order(),log=(state.log||[]).slice().reverse();
  const fmt=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  return '<div class="panel"><h2>Punkte korrigieren</h2><div class="form"><select id="adjP" aria-label="Spieler">'+o.map(u=>'<option value="'+esc(u)+'"'+((adjUser||o[0])===u?' selected':'')+'>'+esc(pname(u))+'</option>').join('')+'</select><input id="adjN" type="number" inputmode="numeric" step="1" placeholder="z. B. -3 oder 5" value="'+esc(adjDraft)+'" style="flex:0 1 150px"><button class="pri" data-act="adjust">Buchen</button></div>'+
   '<details style="margin-top:10px"><summary>Verlauf ('+log.length+')</summary><div class="score" style="margin-top:8px">'+(log.length?log.map(e=>'<div class="sr"><span style="min-width:0;overflow-wrap:anywhere'+(e.undone?';text-decoration:line-through;opacity:.5':'')+'"><span class="note">'+fmt(e.t)+' · R'+((e.r||0)+1)+'</span> <b>'+esc(pname(e.u))+'</b> '+esc(e.txt)+'</span><span class="who">'+(e.d?'<span class="coin'+(e.d<0?' neg':'')+'">'+(e.d>0?'+':'')+e.d+'</span>':'')+(e.k==='adj'&&!e.undone?'<button class="chip" data-act="undoadj" data-id="'+esc(e.id)+'">Rückgängig</button>':'')+'</span></div>').join(''):'<p class="muted" style="margin:0">Noch nichts gebucht.</p>')+'</div></details></div>'}
function resetBlock(){
  return '<div class="panel"><div class="who">'+(confirmReset?'<span>Alles zurücksetzen?</span><button class="pri chip" data-act="reset">Ja, zurücksetzen</button><button class="chip" data-act="cancelreset">Abbrechen</button>':'<button class="chip" data-act="askreset">Spiel zurücksetzen</button>'+(DEMO?'':'<button class="chip" data-act="reloadrounds">Hinweisdatei tauschen</button>'))+'</div></div>'}
function joinView(){
  return '<div class="top"><div><div class="tag">Einen Hinweis, bitte</div><h1>Willkommen</h1></div></div>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<div class="panel"><h2 style="margin-bottom:10px">Wie heißt du?</h2><div class="form"><input id="nm" maxlength="24" autocomplete="off" placeholder="Dein Name" value="'+esc(nameDraft)+'"><button class="pri" data-act="join">Mitspielen</button></div></div>'+
    (Object.keys(roster).filter(u=>u.indexOf('test_')!==0).length?'<div class="panel"><h2 style="margin-bottom:10px">Schon dabei gewesen?</h2><div class="who">'+Object.keys(roster).filter(u=>u.indexOf('test_')!==0).map(u=>'<button class="chip" data-act="claim" data-u="'+esc(u)+'">'+esc(roster[u].name)+'</button>').join('')+'</div></div>':'')}

function render(){
  const app=document.getElementById('app');if(!app)return;
  const ae=document.activeElement,aid=ae&&ae.id,ss=ae&&ae.selectionStart;
  let h,who=null;
  if(mode==='host'){h=hostView();if(preview&&players[preview])who=preview}
  else if(!myName)h=joinView();
  else if(!players[myId])h='<div class="panel"><p class="muted" style="margin:0">'+(linkState==='ok'?'Eintragen …':'Verbinde mit dem Spiel …')+'</p></div>';
  else{h=(linkState!=='ok'?'<div class="note who">Verbindung wird neu hergestellt … <button class="chip" data-act="reconnect">Neu verbinden</button></div>':'')+playerView(myId,false);who=myId}
  const turn=who&&state.turn===who&&(state.phase==='buy1'||state.phase==='buy2');
  const hv=mode==='host'&&!preview&&state.round>=0&&state.phase!=='lobby'&&state.phase!=='done';
  const pl=!!who&&!(mode==='host'&&!preview);
  app.className='wrap'+(turn?' turn':'')+(hv?' dk':'')+(pl?' pl':'')+(mode==='host'&&preview?' pv':'');app.dataset.ph=state.phase;
  if(who)app.style.setProperty('--pc',PCOL[ci(who)]);
  app.innerHTML=h;
  if(aid==='nm'||aid==='adjN'||aid==='ans'){const el=document.getElementById(aid);if(el&&!el.disabled){el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,n=b.dataset.n?+b.dataset.n:null,u=b.dataset.u;
  if(act==='claim'&&roster[u]){myId=u;myName=roster[u].name;lsSet('hb-me',myId);lsSet('hb-name',myName);sendJoin();render()}
  else if(act==='join')playerJoin();
  else if(act==='copylink')copyLink();
  else if(act==='reconnect')connectPlayer();
  else if(act==='ptab'){ptab=b.dataset.t;render()}
  else if(act==='reloadrounds'){hostRounds=null;lsSet('hb-rounds',null);render()}
  else if(act==='pmark')playerMark(+b.dataset.n);
  else if(act==='lock'){const el=document.getElementById('ans');playerAnswer('lock',el?el.value:ansLocal)}
  else if(act==='unlock')playerAnswer('unlock');
  else if(act==='togglesol'){showSol=!showSol;render()}
  else if(act==='adjust'){const p=document.getElementById('adjP'),v=document.getElementById('adjN');hostAct('adjust',{u:p&&p.value,dv:parseInt(v&&v.value,10)})}
  else if(act==='undoadj')hostAct('undoadj',{id:b.dataset.id})
  else if(act==='addtest')addTest();
  else if(act==='rmtest'){preview='';rmTest()}
  else if(act==='askreset'){confirmReset=true;render()}
  else if(act==='cancelreset'){confirmReset=false;render()}
  else if(act==='mark')hostAct('mark',{u:u,v:b.dataset.v==='1'});
  else if(act==='pend')hostAct('pend',{u:u,v:b.dataset.v==='1'});
  else if(act==='view'){preview=u||'';render()}
  else if(act==='jpick'){jsel={u:u,id:b.dataset.id,t:''};render()}
  else if(act==='jcancel'){jsel={u:'',id:'',t:''};render()}
  else if(act==='jplay'){const sl=document.getElementById('jt');hostAct('jplay',{u:jsel.u,id:jsel.id,t:sl?sl.value:''}).then(()=>{if(!msg)jsel={u:'',id:'',t:''};render()})}
  else if(act==='japprove'||act==='japproveall'){const L=((state.req||{})[state.round])||[];const todo=act==='japprove'?L.filter(q=>q.k===b.dataset.k):L.slice().sort((x,y)=>(y.id==='schild')-(x.id==='schild'));
    (async()=>{const er=[];for(const q of todo){const sl=document.getElementById('st_'+q.k);await hostAct('jplay',{u:q.u,id:q.id,t:q.id==='steuer'?(sl?sl.value:''):q.t,rk:q.k});if(msg)er.push(pname(q.u)+': '+msg)}msg=er.join(' · ');render()})()}
  else if(act==='jreject')hostAct('jreject',{k:b.dataset.k});
  else if(act==='jreqpick'){const me=mode==='host'?preview:myId,o=order().filter(x=>x!==me);jreqSel={id:b.dataset.id,t:o[0]||''};render()}
  else if(act==='jreqcancel'){jreqSel={id:'',t:''};render()}
  else if(act==='jreqgo'){const sl=document.getElementById('jrt');playerReq('jreq',{id:jreqSel.id,t:sl?sl.value:jreqSel.t});jreqSel={id:'',t:''};render()}
  else if(act==='jreqwd')playerReq('jcan',{k:b.dataset.k});
  else if(act==='jsell')hostAct('jsell',{s:b.dataset.s,i:+b.dataset.i,u:u});
  else if(act==='junsell')hostAct('junsell',{s:b.dataset.s,i:+b.dataset.i});
  else if(act==='junplay')hostAct('junplay',{k:b.dataset.k});
  else hostAct(act,{n:n,u:u})});
document.addEventListener('input',e=>{
  if(e.target.id==='nm')nameDraft=e.target.value;
  if(e.target.id==='adjN')adjDraft=e.target.value;
  if(e.target.id==='ans'){ansLocal=e.target.value;clearTimeout(dtimer);dtimer=setTimeout(()=>playerAnswer('draft',ansLocal),350)}});
document.addEventListener('change',e=>{if(e.target.id==='rf'&&e.target.files[0])loadRounds(e.target.files[0]);if(e.target.id==='jt')jsel.t=e.target.value;if(e.target.id==='jrt')jreqSel.t=e.target.value;if(e.target.id==='adjP')adjUser=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm')playerJoin();if(e.key==='Enter'&&e.target.id==='ans'&&state.phase==='solve'){const el=e.target;playerAnswer('lock',el.value)}});

function wake(){
  if(document.hidden)return;
  if(mode==='player'){if(!myName)return;if(!pc||!pc.open||linkState!=='ok')connectPlayer();else{try{pc.send({t:'hb',v:-1})}catch(e){connectPlayer()}}}
  else if(!DEMO){try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()}catch(e){}broadcast()}}
document.addEventListener('visibilitychange',wake);window.addEventListener('online',wake);window.addEventListener('pageshow',wake);window.addEventListener('focus',wake);
setInterval(()=>{
  if(mode==='player'){if(!myName||document.hidden)return;
    if(pc&&pc.open){try{pc.send({t:'hb',v:state.ver})}catch(e){}}
    if(linkState==='ok'&&Date.now()-lastRx>12000)connectPlayer();
    else if(linkState==='ok'&&!(pc&&pc.open))connectPlayer()}
  else if(!DEMO){try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()}catch(e){}
    let ch=false;for(const u in conns){const c=conns[u];if(c&&c._seen&&Date.now()-c._seen>20000&&online[u]){online[u]=false;ch=true}}if(ch)render()}},4000);
if(location.hash==='#dbg')window.__dbg={get:()=>state,set:x=>{state=x;render()}};
function boot(){
  const q=new URLSearchParams(location.search).get('h');
  if(q){mode='player';hostParam=q;initPlayer()}else{mode='host';initHost()}
  render()}
boot();
})();

</script>
</body></html>
